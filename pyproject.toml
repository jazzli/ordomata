[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "subscription-agent-orchestrator"
version = "0.1.0"
description = "Local, subscription-only orchestration for AI coding harnesses"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agentops = "agentops.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
