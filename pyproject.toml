[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ordomata"
version = "0.1.0"
description = "A local control plane for governed autonomous work."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ordomata = "ordomata.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
